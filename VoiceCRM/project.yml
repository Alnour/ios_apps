name: VoiceCRM
options:
  bundleIdPrefix: com.alnourkhalifa
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "858CYQVKF8"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_EMIT_LOC_STRINGS: true
targets:
  VoiceCRM:
    type: application
    platform: iOS
    sources:
      - path: VoiceCRM
        excludes:
          - "**/.DS_Store"
    info:
      path: VoiceCRM/Info.plist
      properties:
        CFBundleDisplayName: VoiceCRM
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "VoiceCRM records voice notes about your customers and transcribes them on your device."
        NSSpeechRecognitionUsageDescription: "VoiceCRM transcribes your voice notes on your device."
        LSApplicationQueriesSchemes: [whatsapp]
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alnourkhalifa.VoiceCRM
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  VoiceCRMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoiceCRMTests
    dependencies:
      - target: VoiceCRM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alnourkhalifa.VoiceCRMTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VoiceCRM.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VoiceCRM"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: true
schemes:
  VoiceCRM:
    build:
      targets:
        VoiceCRM: all
        VoiceCRMTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VoiceCRMTests
